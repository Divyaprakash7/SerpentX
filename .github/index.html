<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10231c">
<title>SerpentX</title>
<style>
:root{--bg:#10231c;--panel:#17332a;--grid:#1c3d32;--snake:#e8f5a3;--head:#ffffff;--food:#ff7a59;--text:#e6f2ea;--muted:#8fb3a2}
@media (prefers-color-scheme: light){:root{--bg:#dfeee3;--panel:#c9e0d0;--grid:#bcd6c4;--snake:#1f5c3f;--head:#0b3b26;--food:#d9462a;--text:#12301f;--muted:#4c7560}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bw:min(92vw,420px)}
@supports (height:100dvh){@media (pointer:coarse){:root{--bw:max(250px,min(calc(100vw - 16px),520px,calc(100dvh - 270px - max(8px,env(safe-area-inset-top)) - max(8px,env(safe-area-inset-bottom)))))}}}
html{height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));padding-top:max(12px,env(safe-area-inset-top));touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{touch-action:none}
.bar{display:flex;justify-content:space-between;width:var(--bw);font-size:1.1rem}
.bar span b{font-variant-numeric:tabular-nums}
.wrap{position:relative;width:var(--bw);aspect-ratio:1}
canvas{width:100%;height:100%;display:block;background:var(--panel);border-radius:10px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.55);border-radius:10px;color:#fff;text-align:center;padding:16px}
.overlay.hide{display:none}
.overlay h1{margin:0;font-size:2rem}
.overlay p{margin:0;color:#d5e6dc}
button{font:inherit;font-size:1.05rem;padding:8px 22px;border-radius:8px;border:0;background:var(--food);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.res{display:flex;flex-direction:column;align-items:center;gap:8px;animation:rise .5s ease-out}
.res.hide{display:none}
.res .score{font-size:4.2rem;line-height:1;font-weight:bold;color:#ffd84d;text-shadow:0 3px 0 #b87400}
.res .cap{font-size:.9rem;color:#d5e6dc;margin-top:-4px}
.chips{display:flex;gap:8px}
.chip{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 12px;min-width:70px}
.chip b{display:block;font-size:1.15rem}
.chip span{font-size:.75rem;color:#cfe3d7}
.badge{background:#ffd84d;color:#3a2600;font-weight:bold;padding:3px 14px;border-radius:999px}
.badge.hide{display:none}
.row{display:flex;gap:8px}
.row.hide,button.hide{display:none}
button.ghost{background:transparent;border:2px solid #ffffff77}
.overlay.end{background:rgba(0,0,0,.74)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.res{animation:none}}
#dnote{display:none}
.menu-only{display:none}
.overlay.menu .menu-only{display:block}
.hs{color:#ffd84d;font-size:.95rem}
.overlay.menu{background:rgba(0,0,0,.45)}
.overlay.menu h1{font-size:3.6rem;letter-spacing:.04em;color:#e8f5a3;background:linear-gradient(90deg,#e8f5a3,#7be0a5 55%,#ff8a73);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.overlay.menu #btn{font-size:1.4rem;padding:12px 46px;border-radius:999px;box-shadow:0 0 0 0 rgba(255,122,89,.6);animation:throb 1.8s ease-out infinite}
@keyframes throb{0%{box-shadow:0 0 0 0 rgba(255,122,89,.6)}70%,100%{box-shadow:0 0 0 16px rgba(255,122,89,0)}}
@media (prefers-reduced-motion:reduce){.overlay.menu #btn{animation:none}}
.dpad{display:none;grid-template-columns:repeat(3,64px);grid-template-areas:". up ." "left down right";gap:8px}
.dpad button{height:52px;padding:0;font-size:1.5rem;background:transparent;border:2px solid var(--muted);color:var(--text);border-radius:12px}
.dpad button:active{background:var(--food);border-color:var(--food);color:#fff}
.dpad [data-k=up]{grid-area:up}.dpad [data-k=left]{grid-area:left}.dpad [data-k=down]{grid-area:down}.dpad [data-k=right]{grid-area:right}
.tc{display:none}
.ctrl{display:flex;gap:8px;width:var(--bw)}
.ctrl button{flex:1;padding:7px 10px;font-size:.95rem;background:transparent;border:2px solid var(--muted);color:var(--text)}
.ctrl button:disabled{opacity:.4;cursor:default}
.ctrl button:not(:disabled):hover{border-color:var(--food)}
.diff{display:flex;gap:6px}
.diff button{padding:8px 10px;min-width:92px;font-size:1rem;background:transparent;border:2px solid #ffffff55;color:#fff;display:flex;flex-direction:column;gap:2px;align-items:center}
.diff small{font-size:.68rem;font-weight:normal;opacity:.85}
.diff button.on{background:var(--food);border-color:var(--food)}
.speed{display:flex;align-items:center;gap:10px;width:var(--bw)}
.speed input{flex:1;accent-color:var(--food)}
.speed b{min-width:1.5em;text-align:right;font-variant-numeric:tabular-nums}
.credit{color:var(--muted);font-size:.85rem;text-align:center;letter-spacing:.03em}
.credit b{color:var(--text)}
.hint{color:var(--muted);font-size:.9rem;text-align:center}

/* ---------- mobile / touch ---------- */
@media (pointer:coarse){
  body{gap:8px;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
  .dpad{display:grid;--k:clamp(48px,14.5vw,60px);grid-template-columns:repeat(3,var(--k));gap:6px}
  .dpad button{width:var(--k);height:calc(var(--k)*.82);font-size:1.5rem}
  .hint{display:none}
  .credit{font-size:.78rem}
}
@media (pointer:coarse),(max-width:480px){
  /* board controls: three equal, full-width buttons */
  .ctrl{gap:8px}
  .ctrl button{flex:1;min-height:44px;padding:0 6px;font-size:1rem;border-radius:10px}
  /* speed slider: bigger target */
  .speed{gap:12px}
  .speed input{height:32px;-webkit-appearance:none;appearance:none;background:transparent}
  .speed input::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--grid)}
  .speed input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--food);border:3px solid var(--bg)}
  .speed input::-moz-range-track{height:8px;border-radius:4px;background:var(--grid)}
  .speed input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--food);border:3px solid var(--bg)}
  /* start / results screen buttons */
  .overlay .row{width:100%;max-width:300px;gap:8px}
  .overlay .row button{flex:1;min-height:48px;padding:0 12px}
  .overlay.menu #btn{min-height:54px;font-size:1.25rem;padding:0 16px}
  .diff{width:100%;max-width:300px;gap:6px}
  .diff button{flex:1;min-width:0;min-height:54px;padding:6px 3px;justify-content:center;font-size:.95rem;border-radius:10px;text-align:center}
  .diff small{font-size:.62rem;line-height:1.15}
}
@media (max-width:400px){
  .overlay{padding:10px;gap:7px}
  .overlay h1{font-size:1.7rem}
  .overlay.menu h1{font-size:2.8rem}
  .res .score{font-size:3.4rem}
  .chip{min-width:0;padding:5px 9px}
  .bar{font-size:1rem}
}

@supports (width:1cqw){
@media (pointer:coarse),(max-width:480px){
  .wrap{container-type:inline-size}
  .overlay{padding:4cqw 5cqw;gap:2.2cqw}
  .overlay h1{font-size:8cqw}
  .overlay.menu h1{font-size:13cqw}
  .overlay p{font-size:4cqw;line-height:1.25}
  .hs{font-size:3.8cqw}
  .res{gap:1.6cqw}
  .badge{font-size:3.6cqw;padding:.6cqw 3.5cqw}
  .res .score{font-size:15cqw}
  .res .cap{font-size:3.4cqw;margin-top:-1cqw}
  .chips{gap:2cqw}
  .chip{padding:1.3cqw 2.6cqw;min-width:0;border-radius:2.4cqw}
  .chip b{font-size:4.6cqw}
  .chip span{font-size:3cqw}
  .diff{max-width:none;width:100%;gap:2cqw}
  .diff button{min-height:0;height:14.5cqw;font-size:4.2cqw;padding:0 .5cqw;border-radius:2.6cqw;gap:.4cqw}
  .diff small{font-size:2.6cqw}
  .overlay .row{max-width:none;width:100%;gap:2cqw}
  .overlay .row button{min-height:0;height:12cqw;font-size:4.4cqw;padding:0 3cqw;border-radius:2.8cqw}
  .overlay.menu #btn{height:14cqw;font-size:5.6cqw;border-radius:999px}
  .overlay.end .diff{display:none}
}
}
</style>
</head>
<body>
<div class="bar"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
<div class="wrap">
  <canvas id="c" width="420" height="420"></canvas>
  <div class="overlay menu" id="ov">
    <h1 id="title">SerpentX</h1>
    <div class="res hide" id="res">
      <div class="badge hide" id="nb">New best score!</div>
      <div class="score" id="rs">0</div>
      <div class="cap">apples eaten</div>
      <div class="chips">
        <div class="chip"><b id="rl">Easy</b><span>Level</span></div>
        <div class="chip"><b id="rb">0</b><span>Best</span></div>
        <div class="chip"><b id="rn">3</b><span>Length</span></div>
      </div>
    </div>
    <p id="msg">Eat apples. Dodge rocks. Beat your best.</p>
    <div class="hs menu-only" id="hs"></div>
    <div class="diff" id="diff">
      <button data-d="easy">Easy</button>
      <button data-d="medium">Medium</button>
      <button data-d="hard">Hard</button>
    </div>
    <p id="dnote"></p>
    <div class="row"><button id="btn">Play now</button><button id="bm" class="ghost hide">Menu</button></div>
  </div>
</div>
<div class="ctrl">
  <button id="bp">Pause</button><button id="br">Restart</button><button id="bx">Exit</button>
</div>
<label class="speed">Speed <input type="range" id="spd" min="1" max="10" step="1" value="5"><b id="spdv">5</b></label>
<div class="dpad" id="dpad">
  <button data-k="up" aria-label="Up">&#8593;</button>
  <button data-k="left" aria-label="Left">&#8592;</button>
  <button data-k="down" aria-label="Down">&#8595;</button>
  <button data-k="right" aria-label="Right">&#8594;</button>
</div>
<div class="hint"><span class="kb">Arrow keys / WASD to steer · Space or P to pause · R to restart · Esc to exit</span><span class="tc">Swipe the board or tap the arrows</span></div>
<div class="credit">Powered by <b>The Complie Line</b></div>
<script>
const N=21, S=420/N, cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=cv.height=420*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
let tickN=0,snake,dir,next,food,score,timer,running=false,paused=false,best=0,rocks=[];
const LV={
  easy:{bonus:0,ramp:2,rocks:0,floor:35,note:'Classic rules.'},
  medium:{bonus:2,ramp:3,rocks:12,floor:32,wrap:true,note:'Faster, many rocks, no walls: edges wrap around.'},
  hard:{bonus:4,ramp:4,rocks:14,floor:28,note:'Very fast, rocky board.'}
};
let diff='easy';
try{diff=localStorage.getItem('snakeDiff');if(!LV[diff])diff='easy'}catch(e){diff='easy'}
function setDiff(d){
  diff=d;try{localStorage.setItem('snakeDiff',d)}catch(e){}
  document.querySelectorAll('#diff button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  $('dnote').textContent=LV[d].note;
}
document.querySelectorAll('#diff button').forEach(b=>b.onclick=()=>setDiff(b.dataset.d));
document.querySelectorAll('#diff button').forEach(b=>{
  const c=LV[b.dataset.d],n=b.dataset.d;
  b.innerHTML='<b>'+n[0].toUpperCase()+n.slice(1)+'</b><small>'+(c.wrap?'No walls':'Walls')+' · '+(c.rocks?c.rocks+' rocks':'No rocks')+'</small>';
});
setDiff(diff);
try{best=+localStorage.getItem('snakeBest')||0}catch(e){}
$('best').textContent=best;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir=next={x:1,y:0};score=0;$('score').textContent=0;
  rocks=[];
  while(rocks.length<LV[diff].rocks){
    const r={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N),s:Math.random()*1000};
    // keep the start area (rows 9-11, x 5-15) clear
    if(r.y>=9&&r.y<=11&&r.x>=5&&r.x<=15)continue;
    if(rocks.some(o=>o.x===r.x&&o.y===r.y))continue;
    rocks.push(r);
  }
  placeFood();
}
function placeFood(){
  do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
  while(snake.some(s=>s.x===food.x&&s.y===food.y)||rocks.some(o=>o.x===food.x&&o.y===food.y));
}
function start(){
  stopDemo();hideRes();reset();running=true;paused=false;$('ov').classList.add('hide');
  restartTimer();draw();setCtrl();
}
let level=5;
try{level=+localStorage.getItem('snakeSpeed')||5}catch(e){}
$('spd').value=level;$('spdv').textContent=level;
function interval(){const c=LV[diff];return Math.max(c.floor,220-(level+c.bonus)*18-score*c.ramp)}
function restartTimer(){clearInterval(timer);timer=setInterval(tick,interval())}
$('spd').oninput=e=>{
  level=+e.target.value;$('spdv').textContent=level;
  try{localStorage.setItem('snakeSpeed',level)}catch(err){}
  if(running)restartTimer();
  e.target.blur();
};
function tick(){
  if(paused)return;
  tickN++;
  dir=next;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(LV[diff].wrap){h.x=(h.x+N)%N;h.y=(h.y+N)%N}
  let why=null;
  if(h.x<0||h.y<0||h.x>=N||h.y>=N)why='You hit the wall.';
  else if(snake.some(s=>s.x===h.x&&s.y===h.y))why='You ran into yourself.';
  else if(rocks.some(o=>o.x===h.x&&o.y===h.y))why='You hit a rock.';
  if(why)return over(why);
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score++;$('score').textContent=score;placeFood();
    restartTimer();
  }else snake.pop();
  draw();
}
function over(why){
  running=false;clearInterval(timer);setCtrl();
  const newBest=score>best&&score>0;
  if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('snakeBest',best)}catch(e){}}
  $('title').textContent='Game over';
  $('msg').textContent=why||'';
  $('rs').textContent=score;
  $('rl').textContent=diff[0].toUpperCase()+diff.slice(1);
  $('rb').textContent=best;
  $('rn').textContent=snake.length;
  $('nb').classList.toggle('hide',!newBest);
  $('res').classList.remove('hide');$('bm').classList.remove('hide');
  $('btn').textContent='Play again';
  $('ov').classList.add('end');
  $('ov').classList.remove('hide');$('btn').focus();
}
function hideRes(){
  $('res').classList.add('hide');$('bm').classList.add('hide');$('ov').classList.remove('end');
}
function draw(){
  ctx.clearRect(0,0,420,420);
  ctx.fillStyle=css('--grid');
  for(let x=0;x<N;x++)for(let y=0;y<N;y++)if((x+y)%2)ctx.fillRect(x*S,y*S,S,S);
  rocks.forEach(drawRock);
  drawApple(food.x*S+S/2,food.y*S+S/2+1);
  ctx.fillStyle=css('--snake');
  for(let i=snake.length-1;i>0;i--){
    const s=snake[i];
    ctx.beginPath();ctx.roundRect(s.x*S+1,s.y*S+1,S-2,S-2,5);ctx.fill();
  }
  drawHead();
}
function drawHead(){
  const h=snake[0],cx=h.x*S+S/2,cy=h.y*S+S/2,dx=dir.x,dy=dir.y,px=-dy,py=dx;
  // forked tongue, flicking every other move
  if((running||demoT)&&tickN%2){
    const bx=cx+dx*S*.5,by=cy+dy*S*.5,tx=bx+dx*S*.45,ty=by+dy*S*.45;
    ctx.strokeStyle=css('--food');ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(tx,ty);
    ctx.moveTo(tx,ty);ctx.lineTo(tx+dx*S*.18+px*S*.14,ty+dy*S*.18+py*S*.14);
    ctx.moveTo(tx,ty);ctx.lineTo(tx+dx*S*.18-px*S*.14,ty+dy*S*.18-py*S*.14);
    ctx.stroke();
  }
  // head: slightly bigger than the body
  ctx.fillStyle=css('--head');
  ctx.beginPath();ctx.roundRect(h.x*S-1,h.y*S-1,S+2,S+2,9);ctx.fill();
  // eyes
  [-1,1].forEach(sd=>{
    const ex=cx+dx*S*.14+px*sd*S*.24,ey=cy+dy*S*.14+py*sd*S*.24;
    ctx.fillStyle=css('--bg');
    ctx.beginPath();ctx.arc(ex,ey,S*.15,0,7);ctx.fill();
    ctx.fillStyle=css('--snake');
    ctx.beginPath();ctx.arc(ex+dx*S*.05-px*sd*S*.02,ey+dy*S*.05,S*.05,0,7);ctx.fill();
  });
}
function rnd(seed,i){const x=Math.sin(seed*9301+i*49297)*233280;return x-Math.floor(x)}
function drawRock(o){
  const cx=o.x*S+S/2,cy=o.y*S+S/2+1,R=S*.47,n=9,pts=[];
  for(let k=0;k<n;k++){
    const a=k/n*Math.PI*2+(rnd(o.s,k)-.5)*.5,r=R*(.74+.26*rnd(o.s,k+20));
    pts.push([cx+Math.cos(a)*r*1.05,cy+Math.sin(a)*r*.9]);
  }
  const path=()=>{ctx.beginPath();pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()};
  // ground shadow
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();ctx.ellipse(cx+1,cy+R*.8,R*.95,R*.28,0,0,7);ctx.fill();
  // body
  const g=ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
  g.addColorStop(0,'#d2cfc8');g.addColorStop(.5,'#8d8a83');g.addColorStop(1,'#4a4843');
  ctx.fillStyle=g;path();ctx.fill();
  ctx.save();path();ctx.clip();
  // lit facet (top-left) and shaded facet (bottom-right)
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath();ctx.moveTo(cx-R*.1,cy-R*.1);[5,6,7,8].forEach(k=>ctx.lineTo(pts[k][0],pts[k][1]));ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.25)';
  ctx.beginPath();ctx.moveTo(cx+R*.1,cy+R*.1);[1,2,3,4].forEach(k=>ctx.lineTo(pts[k][0],pts[k][1]));ctx.fill();
  // crack and speckles
  ctx.strokeStyle='rgba(30,28,25,.55)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx+R*(rnd(o.s,40)-.5),cy-R*.5);
  ctx.lineTo(cx+R*(rnd(o.s,41)-.5)*.5,cy);ctx.lineTo(cx+R*(rnd(o.s,42)-.3)*.6,cy+R*.5);ctx.stroke();
  ctx.fillStyle='rgba(40,38,34,.45)';
  for(let k=0;k<4;k++){ctx.fillRect(cx+(rnd(o.s,50+k)-.5)*R*1.2,cy+(rnd(o.s,60+k)-.5)*R*1,1.4,1.4)}
  ctx.restore();
  ctx.strokeStyle='rgba(25,23,20,.8)';ctx.lineWidth=1.2;ctx.lineJoin='round';path();ctx.stroke();
}
function drawApple(cx,cy){
  const r=S*.42;
  // ground shadow
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath();ctx.ellipse(cx,cy+r*.95,r*.8,r*.22,0,0,7);ctx.fill();
  // body: two lobes, shaded like a sphere
  const g=ctx.createRadialGradient(cx-r*.35,cy-r*.35,r*.1,cx,cy+r*.1,r*1.25);
  g.addColorStop(0,'#ff8a73');g.addColorStop(.35,'#e0262b');g.addColorStop(1,'#7a0a12');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(cx-r*.3,cy+r*.1,r*.75,0,7);
  ctx.arc(cx+r*.3,cy+r*.1,r*.75,0,7);
  ctx.fill();
  // dimple at the top
  ctx.fillStyle='rgba(60,0,5,.55)';
  ctx.beginPath();ctx.ellipse(cx,cy-r*.62,r*.2,r*.1,0,0,7);ctx.fill();
  // stem
  ctx.strokeStyle='#5a3a1c';ctx.lineWidth=Math.max(1.5,S*.09);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,cy-r*.6);ctx.quadraticCurveTo(cx+r*.05,cy-r*1,cx+r*.22,cy-r*1.15);ctx.stroke();
  // leaf
  const lg=ctx.createLinearGradient(cx+r*.2,cy-r*1.1,cx+r*.8,cy-r*.8);
  lg.addColorStop(0,'#7fd150');lg.addColorStop(1,'#2f7d26');
  ctx.fillStyle=lg;
  ctx.beginPath();ctx.ellipse(cx+r*.55,cy-r*.98,r*.38,r*.17,-.45,0,7);ctx.fill();
  // glossy highlight
  ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.beginPath();ctx.ellipse(cx-r*.5,cy-r*.15,r*.17,r*.3,.5,0,7);ctx.fill();
}
function turn(x,y){
  if(x===-dir.x&&y===-dir.y)return;
  next={x,y};
}
function pause(){
  if(!running)return;paused=!paused;
  $('title').textContent='Paused';$('msg').textContent='Press Space to resume.';
  $('btn').textContent='Resume';$('ov').classList.toggle('hide',!paused);setCtrl();
}
let demoT=0,demoI=0,demoF=9;
const DP=(()=>{const P=[],a=4,b=16;
  for(let x=a;x<b;x++)P.push({x,y:a});
  for(let y=a;y<b;y++)P.push({x:b,y});
  for(let x=b;x>a;x--)P.push({x,y:b});
  for(let y=b;y>a;y--)P.push({x:a,y});
  return P})();
function demoStep(){
  const L=DP.length;
  demoI=(demoI+1)%L;
  snake=[];for(let k=0;k<8;k++)snake.push(DP[(demoI-k+L*2)%L]);
  const c=DP[demoI],nx=DP[(demoI+1)%L];
  dir={x:nx.x-c.x,y:nx.y-c.y};
  if(demoI===demoF)demoF=(demoF+13)%L;
  food=DP[demoF];tickN++;draw();
}
function startDemo(){
  stopDemo();rocks=[];demoI=0;demoF=9;
  $('hs').textContent=best?'Your best: '+best:'Set your first high score!';
  $('ov').classList.add('menu');$('ov').classList.remove('end');
  demoStep();demoT=setInterval(demoStep,130);
}
function stopDemo(){clearInterval(demoT);demoT=0;$('ov').classList.remove('menu')}
function setCtrl(){
  $('bp').textContent=paused?'Resume':'Pause';
  $('bp').disabled=!running;$('br').disabled=!running;$('bx').disabled=!running;
}
function exitToMenu(){
  running=false;paused=false;clearInterval(timer);hideRes();
  reset();setCtrl();
  $('title').textContent='SerpentX';
  $('msg').textContent='Eat apples. Dodge rocks. Beat your best.';
  $('btn').textContent='Play now';
  $('ov').classList.remove('hide');startDemo();
}
$('bp').onclick=e=>{pause();e.target.blur()};
$('br').onclick=e=>{if(running)start();e.target.blur()};
$('bm').onclick=e=>{exitToMenu();e.target.blur()};
$('bx').onclick=e=>{exitToMenu();e.target.blur()};
setCtrl();
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m){e.preventDefault();if(running&&!paused)turn(...m);}
  else if(k===' '){e.preventDefault();running?pause():start();}
  else if(k==='p'&&running){pause()}
  else if(k==='r'&&running){start()}
  else if(k==='escape'&&running){exitToMenu()}
});
$('btn').onclick=()=>{paused?pause():start()};
let sx=null,sy=null;
const wrapEl=document.querySelector('.wrap');
wrapEl.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
wrapEl.addEventListener('touchmove',e=>{
  if(sx===null)return;
  e.preventDefault();
  if(!running||paused)return;
  const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;
  Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1);
  sx=t.clientX;sy=t.clientY;
},{passive:false});
wrapEl.addEventListener('touchend',()=>{sx=null});
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
document.querySelectorAll('#dpad button').forEach(b=>b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(running&&!paused)turn(...DIRS[b.dataset.k]);
}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause()});
reset();startDemo();
</script>
</body>
